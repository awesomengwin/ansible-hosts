name: cd

on:
  repository_dispatch:
    types: [ delivery ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      IMAGE: ${{ github.event.client_payload.image }}
      VERSION: ${{ github.event.client_payload.version }}
      ENVIRONMENT: ${{ startsWith(github.event.client_payload.version, 'sha-') && 'staging' || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Update image version
        env:
          APP_VARS_PATH: group_vars/${{ env.ENVIRONMENT }}/vars
        run: |
          if ! grep -q "$IMAGE:" "$APP_VARS_PATH"; then
            echo "$IMAGE is not found in $APP_VARS_PATH"
            exit 1
          fi

          sed -i "s|$IMAGE:.*|$IMAGE:$VERSION|" "$APP_VARS_PATH"

          cat "$APP_VARS_PATH"

      - name: Commit updated image
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update ${{ env.IMAGE }} at ${{ env.APP_VARS_PATH }} to version ${{ env.VERSION }}"
          branch: main

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run Ansible command
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ startsWith(github.event.client_payload.version, 'sha-') && secrets.ANSIBLE_VAULT_PASSWORD_STAGING || secrets.ANSIBLE_VAULT_PASSWORD_PRODUCTION }}
        run: |
          umask 077
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault-password
          ansible-playbook -i "inventory_$ENVIRONMENT" playbook.yml --vault-password-file .vault-password
